name: B2B Atlas V1.2 visual acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-v12.yml']
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Check live UI
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          BASE='https://b2b-design-atlas-preview.onrender.com'
          async def main():
              out=Path('screenshots/qa-v12');out.mkdir(parents=True,exist_ok=True)
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  for label,w in [('desktop',1440),('mobile',390)]:
                      page=await b.new_page(viewport={'width':w,'height':900},device_scale_factor=1)
                      errs=[];page.on('pageerror',lambda e:errs.append(str(e)))
                      for route,name in [('/','home'),('/websites','websites'),('/sections','sections')]:
                          await page.goto(BASE+route,wait_until='networkidle',timeout=80000)
                          await page.locator('h1').first.wait_for()
                          if name in ('websites','sections'):
                              assert await page.locator('.filter-sidebar').count()==0
                              assert await page.locator('.filter-strip').count()==1
                          if name=='websites':
                              assert await page.locator('.website-grid .site-tile').count()==10
                          if name=='sections':
                              assert await page.locator('.module-grid .module-tile').count()==16
                          assert await page.evaluate('document.documentElement.scrollWidth-innerWidth')<=2
                          assert not errs,errs
                          await page.evaluate("""async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,40))}scrollTo(0,0);await Promise.race([Promise.all([...document.images].map(i=>i.decode().catch(()=>null))),new Promise(r=>setTimeout(r,3500))])}""")
                          await page.screenshot(path=str(out/f'{name}-{label}.png'),full_page=(label=='desktop'))
                          print('PASS',label,name,flush=True)
                      await page.close()
                  await b.close()
          asyncio.run(main())
          PY
      - name: Save screenshots
        run: |
          git config user.name "Atlas QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/qa-v12/
          git diff --cached --quiet || (git commit -m "Save V1.2 visual acceptance screenshots" && git restore . && git pull --rebase origin main && git push origin HEAD:main)
