name: V77 Retina screenshots for four featured websites
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_high_dpi_v77.py'
      - '.github/workflows/capture-high-dpi-v77.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-v77-high-dpi
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real screenshot capture dependencies
        run: |
          python -m pip install -q playwright pillow
          google-chrome --version
          python -m py_compile scripts/capture_high_dpi_v77.py
      - name: Capture four real source websites at DPR 2
        run: python scripts/capture_high_dpi_v77.py
      - name: Validate captured image pixel counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          report = json.loads(Path("screenshots/quality-v77/report.json").read_text())
          found = 0
          for item in report["results"]:
              name = item["site"]
              if item["status"] != "captured":
                  print("KEPT_VERIFIED_ORIGINAL", name, item.get("reason"))
                  continue
              for path, shape in [
                  (Path("screenshots/sites") / (name + ".webp"), (2880,1840)),
                  (Path("screenshots/featured") / (name + "-800.webp"), (800,488)),
              ]:
                  with Image.open(path) as image:
                      assert image.size == shape, (str(path),image.size,shape)
                      assert image.format == "WEBP"
              found += 1
          assert found >= 1
          print("REAL_RETINA_CAPTURE_VALIDATED", found, "/4")
          PY
      - name: Commit only authentic validated screenshots and capture report
        run: |
          git config user.name "B2B Atlas Real Capture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/sites screenshots/featured screenshots/quality-v77/report.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: replace featured screenshots with verified Retina source captures"
            git restore .
            git pull --rebase origin main
            git push origin HEAD:main
          fi
