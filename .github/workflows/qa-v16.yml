name: Verify V1.6 gallery against real screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v16.yml'
permissions:
  contents: write
jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and app
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
          tar -xzf atlas-source-v16.tar.gz -C .
          python -m pip install -q -r requirements.txt
          python create_module_catalog.py
      - name: Start site
        run: |
          ATLAS_DB_PATH=/tmp/b2b-atlas-v16.sqlite3 PORT=8796 python run.py > /tmp/v16-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8796/api/health && break || sleep 1; done
      - name: Verify gallery UX and screenshots
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright

          BASE='http://127.0.0.1:8796'
          async def main():
            folder=Path('screenshots/qa-v16')
            folder.mkdir(exist_ok=True,parents=True)
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for mode,width in [('desktop',1440),('mobile',390)]:
                page=await browser.new_page(viewport={'width':width,'height':900},device_scale_factor=1)
                errors=[]
                page.on('pageerror',lambda e:errors.append(str(e)))
                for path,name in [('/websites','websites'),('/sections','sections'),('/patterns','patterns')]:
                  await page.goto(BASE+path,wait_until='networkidle',timeout=70000)
                  await page.evaluate("""async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=600){scrollTo(0,y);await new Promise(r=>setTimeout(r,25));}scrollTo(0,0);await Promise.race([Promise.all([...document.images].map(i=>i.decode().catch(()=>null))),new Promise(r=>setTimeout(r,3500))]);}""")
                  overflow=await page.evaluate('document.documentElement.scrollWidth>window.innerWidth+2')
                  assert not overflow,(mode,name,'overflow')
                  assert not errors,(mode,name,errors)
                  # Force-load all native lazy images before asserting full-page capture completeness.
                  await page.evaluate("""async()=>{
                    const imgs=[...document.images];
                    for(const img of imgs) img.loading='eager';
                    await Promise.race([
                      Promise.all(imgs.map(img=>img.decode().catch(()=>null))),
                      new Promise(resolve=>setTimeout(resolve,11000))
                    ]);
                  }""")
                  broken=await page.evaluate('[...document.images].filter(x=>!x.naturalWidth).length')
                  assert broken==0,(mode,name,'broken images',broken)
                  if name=='websites':
                    assert await page.locator('.v13-website-wall .site-card').count()==10
                    imageFit=await page.locator('.site-card .site-image img').first.evaluate('(x)=>getComputedStyle(x).objectFit')
                    assert imageFit=='contain',imageFit
                    if mode=='desktop':
                      boxes=await page.locator('.v13-website-wall .site-card').all()
                      xs=[(await x.bounding_box())['x'] for x in boxes[:3]]
                      assert xs[0]<xs[1]<xs[2],xs
                  if name=='sections':
                    assert await page.locator('.v13-section-wall .module-card').count()==16
                    assert await page.locator('.module-card .module-picture img').first.evaluate('(x)=>getComputedStyle(x).objectFit')=='contain'
                  if name=='patterns':
                    assert await page.locator('.pattern-row-v16').count()==4
                    assert await page.locator('.pattern-example-v16').count()==8
                  await page.screenshot(path=str(folder/f'{name}-{mode}.png'),full_page=(mode=='desktop'))
                  print('PASS',name,mode,'images',await page.locator('img').count(),flush=True)
                await page.close()
              await browser.close()
          asyncio.run(main())
          PY
      - name: Save review screenshots
        if: success()
        run: |
          git config user.name "B2B Atlas QA"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/qa-v16/
          git diff --cached --quiet || (git commit -m "Save v1.6 visual QA" && git restore . && git pull --rebase origin main && git push origin HEAD:main)
