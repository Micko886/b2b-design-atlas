name: Inspect atlas catalog schema for verified source expansion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-source-schema.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current catalog and capture contract
        run: |
          mkdir /tmp/atlas-current
          tar -xzf atlas-source-v17.tar.gz -C /tmp/atlas-current
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path('/tmp/atlas-current')
          for f in ['app/source_index.json','app/module_catalog.json','create_module_catalog.py','capture_real_sites.py','app/main.py']:
            p=d/f
            print('===== SCHEMA FILE',f,'EXISTS',p.exists())
            if not p.exists():continue
            if p.suffix=='.json':
              data=json.loads(p.read_text())
              print('ROOT',type(data).__name__, list(data) if isinstance(data,dict) else len(data))
              if isinstance(data,dict):
                for k,v in data.items():
                  print('ENTRY',k,'len',len(v) if isinstance(v,list) else '', 'sample',json.dumps(v[0] if isinstance(v,list) and v else v,ensure_ascii=False)[:2800])
              else:print('SAMPLE',json.dumps(data[0] if data else {},ensure_ascii=False)[:2800])
            else:
              x=p.read_text()
              print(x[:5000] if f=='app/main.py' else x[:10000])
          print('ROOTFILES',[p.name for p in d.iterdir()])
          PY
