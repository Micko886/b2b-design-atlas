name: Repair V1.9 real capture quality
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recapture-v19-quality.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recapture-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Chromium, not reconstructed screenshot tools
        run: |
          python -m pip install -q playwright pillow
          python -m playwright install --with-deps chromium
      - name: Use original consent controls and recapture three problem screenshots
        run: python scripts/recapture-v19-quality.py
      - name: Validate responsive catalog still loads correctly with repaired originals
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-v19check"
          tar -xzf atlas-source-v19.tar.gz -C "$RUNNER_TEMP/atlas-v19check"
          cp -a screenshots "$RUNNER_TEMP/atlas-v19check/screenshots"
          python -m pip install -q -r "$RUNNER_TEMP/atlas-v19check/requirements.txt"
          cd "$RUNNER_TEMP/atlas-v19check"
          python create_module_catalog.py
          ATLAS_DB_PATH=/tmp/atlas-v19checked.sqlite3 PORT=8799 python run.py >/tmp/v19-quality-site.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8799/api/health && break || sleep 1; done
          python - <<'PY'
          import asyncio
          from PIL import Image,ImageStat
          from pathlib import Path
          from playwright.async_api import async_playwright
          ids=('universal-robots','siemens-healthineers','boston-dynamics')
          for ident in ids:
            for kind in ['sites','notes','modules']:
              names=[ident+'.webp'] if kind=='sites' else [ident+'-hero.webp',ident+'-detail.webp']
              for f in names:
                im=Image.open(Path('screenshots')/kind/f)
                assert im.width>=1100 and im.height>=250,(ident,kind,f,im.size)
                assert max(ImageStat.Stat(im.resize((80,50)).convert('RGB')).stddev)>12
          async def test():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for w in [1440,390]:
                page=await b.new_page(viewport={'width':w,'height':900},device_scale_factor=1)
                errors=[];page.on('pageerror',lambda ex:errors.append(str(ex)))
                for route,cls in [('/websites','.site-card'),('/sections','.module-card')]:
                  await page.goto('http://127.0.0.1:8799'+route,wait_until='networkidle')
                  expected=51 if cls=='.site-card' else 97
                  assert await page.locator(cls).count()==expected,(cls,w,expected)
                  for ident in ids:
                    original=('screenshots/sites/'+ident+'.webp' if cls=='.site-card' else 'screenshots/modules/'+ident+'-hero.webp')
                    matches=page.locator('img[src="/'+original+'"]')
                    assert await matches.count()==1,(w,cls,ident,'not in catalog')
                    assert await matches.first.evaluate('(el)=>el.complete && el.naturalWidth>0'),(w,cls,ident,'image broken')
                  assert not errors,errors
                  assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  print('PASS V19 quality gallery',cls,w)
                await page.close()
              await b.close()
          asyncio.run(test())
          PY
      - name: Commit improved real screenshots and quality evidence
        run: |
          git config user.name "B2B Atlas Visual QA"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/sites/boston-dynamics.webp screenshots/sites/universal-robots.webp screenshots/sites/siemens-healthineers.webp
          git add screenshots/notes/boston-dynamics* screenshots/notes/universal-robots* screenshots/notes/siemens-healthineers*
          git add screenshots/modules/boston-dynamics* screenshots/modules/universal-robots* screenshots/modules/siemens-healthineers*
          git add screenshots/research-v19/contact-sheet.jpg screenshots/research-v19/recapture-quality.json
          if ! git diff --cached --quiet; then
            git commit -m "Repair real V1.9 previews and dismiss actual cookie consent panels"
            git restore .
            git pull --rebase origin main
            git push origin HEAD:main
          fi
