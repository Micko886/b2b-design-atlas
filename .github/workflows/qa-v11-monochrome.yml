name: B2B Atlas V1.1 monochrome visual QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-v11-monochrome.yml']
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          pip install -q playwright
          playwright install --with-deps chromium
      - name: Validate live home and gallery
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          BASE='https://b2b-design-atlas-preview.onrender.com'
          async def main():
            dest=Path('screenshots/qa-v11')
            dest.mkdir(parents=True,exist_ok=True)
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for name,w in [('desktop',1440),('mobile',390)]:
                page=await browser.new_page(viewport={'width':w,'height':900},device_scale_factor=1)
                errors=[]
                page.on('pageerror',lambda e: errors.append(str(e)))
                for route,label in [('/','home'),('/websites','websites'),('/sections','sections')]:
                  await page.goto(BASE+route,wait_until='networkidle',timeout=75000)
                  await page.locator('.site-image, .module-picture').first.wait_for(state='visible',timeout=16000)
                  palette=await page.evaluate("""() => {
                    const st=getComputedStyle(document.documentElement);
                    return {paper:st.getPropertyValue('--page-bg').trim(),
                    accent:st.getPropertyValue('--accent').trim(),
                    surface:st.getPropertyValue('--canvas').trim(),
                    cards:[...document.querySelectorAll('.site-image,.module-picture')].slice(0,2).map(e=>getComputedStyle(e).backgroundColor),
                    overflow:document.documentElement.scrollWidth-window.innerWidth}
                  }""")
                  assert palette['paper']=='#F5F5F7',palette
                  assert palette['accent']=='#1D1D1F',palette
                  assert palette['surface']=='#FFFFFF',palette
                  assert all(c=='rgb(255, 255, 255)' for c in palette['cards']),palette
                  assert palette['overflow']<=2,palette
                  assert not errors,errors
                  await page.screenshot(path=str(dest/f'{label}-{name}.png'),full_page=False)
                  print('PASS',name,label,palette,flush=True)
                await page.goto(BASE+'/websites',wait_until='networkidle',timeout=75000)
                assert await page.locator('.site-tile').count()>=10
                await page.close()
              await browser.close()
          asyncio.run(main())
          PY
      - name: Save screenshots to repository
        if: success()
        run: |
          git config user.name "Atlas QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/qa-v11/
          git diff --cached --quiet || (git commit -m "Save V1.1 black-white gallery QA" && git restore . && git pull --rebase origin main && git push origin HEAD:main)
