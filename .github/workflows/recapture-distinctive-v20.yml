name: Correct staged V2.0 visual screenshot quality
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recapture-distinctive-v20.yml'
      - 'scripts/recapture-distinctive-v20.py'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install -q playwright pillow
          python -m playwright install --with-deps chromium
      - name: Interact with real consent controls and recapture
        run: python scripts/recapture-distinctive-v20.py
      - name: Verify screenshot integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('screenshots')
          d=json.loads((root/'research-v20/recapture-report.json').read_text())
          print('V20_RECAPTURE',d)
          for entry in d:
            if entry['status']!='recaptured':continue
            ident=entry['id']
            for folder,names in [('sites',[ident+'.webp']),('notes',[ident+'-hero.webp',ident+'-detail.webp']),('modules',[ident+'-hero.webp',ident+'-detail.webp'])]:
              for name in names:
                path=root/folder/name
                assert path.exists(),path
                with Image.open(path) as im:
                  assert im.width==1440
                  assert im.height>=500
          assert sum(x['status']=='recaptured' for x in d)>=1
          PY
      - name: Commit staged image refinements
        run: |
          git config user.name "B2B Atlas QA"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/sites screenshots/notes screenshots/modules screenshots/research-v20
          if ! git diff --cached --quiet; then
            git commit -m "Improve distinctive site captures through normal consent and scrolling"
            git restore .
            git pull --rebase origin main
            git push origin HEAD:main
          fi
