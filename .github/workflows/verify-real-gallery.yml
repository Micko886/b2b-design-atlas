name: Smoke check real B2B screenshot gallery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-real-gallery.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed website and original browser captures
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://b2b-design-atlas-preview.onrender.com'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'B2B-Atlas-Deployment-Smoke/1.0'})
              with urllib.request.urlopen(req,timeout=75) as response:
                  return response.status,response.read()
          for path in ['/','/websites','/sections','/assets/atlas-v03.js']:
              status, body=get(path)
              assert status==200 and len(body)>100, (path,status,len(body))
              print('PAGE OK',path,len(body),flush=True)
          status,raw=get('/api/source-library')
          assert status==200
          payload=json.loads(raw)
          sites=[x for x in payload['sites'] if x.get('screenshot_url')]
          notes=[x for x in payload['notes'] if x.get('screenshot_url')]
          print('SCREENSHOT INDEX',len(sites),'sites',len(notes),'pages',flush=True)
          assert len(sites)>=8 and len(notes)>=15, (len(sites),len(notes))
          for item in sites[:3]+notes[:3]:
              url=item['screenshot_url']
              status,body=get(url)
              assert status==200 and body[:4]==b'RIFF' and body[8:12]==b'WEBP', (url,status,len(body))
              print('REAL WEBP OK',url,len(body),flush=True)
          print('PASS: Live website + real screenshots verified',flush=True)
          PY
