name: V1.3 visual acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-v13.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install -q playwright
          playwright install --with-deps chromium
      - name: Wait for V1.3 and capture real UI
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          BASE='https://b2b-design-atlas-preview.onrender.com'
          async def main():
            out=Path('screenshots/qa-v13'); out.mkdir(parents=True,exist_ok=True)
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=await b.new_page(viewport={'width':1440,'height':900})
              ready=False
              for _ in range(24):
                await page.goto(BASE+'/?v=13',wait_until='networkidle',timeout=80000)
                bg=await page.locator('.home-split-band').evaluate("el=>getComputedStyle(el).backgroundColor")
                cols=await page.locator('.home-wall').evaluate("el=>getComputedStyle(el).gridTemplateColumns")
                if bg=='rgb(17, 17, 17)' and len(cols.split())>=10:
                  ready=True; break
                await page.wait_for_timeout(5000)
              assert ready,(bg,cols)
              await page.close()
              for mode,width in [('desktop',1440),('mobile',390)]:
                page=await b.new_page(viewport={'width':width,'height':900},device_scale_factor=1)
                errors=[]; page.on('pageerror',lambda e:errors.append(str(e)))
                for route,name in [('/','home'),('/websites','websites'),('/sections','sections')]:
                  await page.goto(BASE+route+'?v=13',wait_until='networkidle',timeout=80000)
                  await page.locator('h1').first.wait_for()
                  overflow=await page.evaluate('document.documentElement.scrollWidth-innerWidth')
                  assert overflow<=2,(mode,name,overflow)
                  assert not errors,(mode,name,errors)
                  if name=='home' and mode=='desktop':
                    assert await page.locator('.home-wall .site-tile').count()>=7
                    bg=await page.locator('.home-split-band').evaluate("el=>getComputedStyle(el).backgroundColor")
                    assert bg=='rgb(17, 17, 17)',bg
                  await page.screenshot(path=str(out/f'{name}-{mode}.png'),full_page=(mode=='desktop'))
                  print('PASS',mode,name,'overflow',overflow,flush=True)
                await page.close()
              await b.close()
          asyncio.run(main())
          PY
      - name: Save evidence
        run: |
          git config user.name "Atlas QA"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/qa-v13/
          git diff --cached --quiet || (git commit -m "Save V1.3 visual acceptance screenshots" && git pull --rebase origin main && git push origin HEAD:main)
