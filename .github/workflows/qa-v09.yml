name: Atlas v0.9 visual acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-v09.yml'
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt || true
          python -m pip install -q playwright pillow fastapi uvicorn python-multipart
          python -m playwright install --with-deps chromium
      - name: Extract code, build module crops and start server
        run: |
          base64 -d atlas-source-v09.b64 | tar -xz -C .
          python -m pip install -q -r requirements.txt
          python create_module_catalog.py
          sed -i "s@/srv/atlas/static@$(pwd)/static@g" scripts/patch-v09-site-review.py
          python scripts/patch-v09-site-review.py
          ATLAS_DB_PATH=/tmp/atlas-qa-v09.sqlite3 PORT=8977 python run.py > /tmp/atlas-v09.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8977/api/health && break || sleep 1; done
      - name: Browser screenshot and functionality tests
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          ROOT='http://127.0.0.1:8977'
          async def main():
            path=Path('screenshots/qa-v09');path.mkdir(parents=True,exist_ok=True)
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for mode,width in [('desktop',1440),('mobile',390)]:
                pg=await b.new_page(viewport={'width':width,'height':900})
                errors=[]
                pg.on('pageerror', lambda e: errors.append(str(e)))
                for route,name in [('/','home'),('/websites','websites'),('/sections','sections'),('/websites/fictiv','detail')]:
                  await pg.goto(ROOT+route,wait_until='networkidle',timeout=60000)
                  await pg.locator('h1').first.wait_for()
                  if mode=='mobile' and name=='home':
                    assert await pg.locator('#main-nav').is_hidden(),'Mobile navigation must default to closed'
                    await pg.locator('#menu-button').click()
                    assert await pg.locator('#main-nav').is_visible(),'Menu button must open navigation'
                    await pg.locator('#menu-button').click()
                    assert await pg.locator('#main-nav').is_hidden(),'Menu button must close navigation'
                  await pg.evaluate("""async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,35))}scrollTo(0,0);await Promise.race([Promise.all([...document.images].map(i=>i.decode().catch(()=>null))),new Promise(r=>setTimeout(r,4000))])}""")
                  assert not errors,(mode,name,errors)
                  overflow=await pg.evaluate('document.documentElement.scrollWidth-innerWidth')
                  assert overflow<=2,(mode,name,'overflow',overflow)
                  await pg.screenshot(path=str(path/f'{name}-{mode}.png'),full_page=(width==1440))
                  print('PASS',mode,name,'overflow',overflow,'cards',await pg.locator('.a9-card').count(),flush=True)
                await pg.goto(ROOT+'/websites',wait_until='networkidle')
                assert await pg.locator('.a9-website-grid .a9-card').count()==10
                await pg.locator('[data-filter="sector"][data-value="Manufacturing"]').click()
                n=await pg.locator('.a9-website-grid .a9-card').count()
                assert 0<n<10,n
                await pg.goto(ROOT+'/sections',wait_until='networkidle')
                assert await pg.locator('.a9-section-grid .a9-card').count()==16
                await pg.locator('[data-compare]').first.click()
                await pg.locator('[data-compare]').nth(1).click()
                await pg.locator('[data-compare-open]').click()
                assert await pg.locator('.a9-compare-columns>div').count()==2
                await pg.locator('[data-compare-close]').click()
                print('PASS',mode,'filters and section comparison',flush=True)
                await pg.close()
              await b.close()
          asyncio.run(main())
          PY
      - name: Upload screenshot evidence
        if: success()
        run: |
          git config user.name "Atlas QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/qa-v09/
          git diff --cached --quiet || (git commit -m "Record V0.9 visual acceptance" && git restore . && git pull --rebase origin main && git push origin HEAD:main)
